<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlockDead — просмотр зомби</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e4e4e2;
        font: 13px system-ui, sans-serif;
      }
      #ui {
        position: fixed;
        top: 8px;
        left: 8px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 230px;
      }
      #ui button {
        margin: 1px;
      }
      #ui .on {
        background: #2b2b2b;
        color: #fff;
      }
      #stats {
        font-family: ui-monospace, monospace;
        white-space: pre;
      }
      #tabs {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }
      #tabs .on,
      #weaponUi .on {
        background: #2b2b2b;
        color: #fff;
      }
      #weaponUi {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 6px;
        padding: 8px;
        display: none;
        flex-direction: column;
        gap: 6px;
        max-width: 240px;
      }
      #wstats {
        font-family: ui-monospace, monospace;
        white-space: pre;
      }
      #ref {
        z-index: 9;
        position: fixed;
        right: 8px;
        bottom: 8px;
        width: 40vw;
        display: none;
        border: 1px solid #999;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <label>Тип <select id="type"></select></label>
      <div id="anims"></div>
      <div id="views"></div>
      <label><input type="checkbox" id="outline" checked /> обводка</label>
      <label><input type="checkbox" id="showref" /> референс</label>
      <button id="export">Экспорт GLB</button>
      <div id="stats"></div>
    </div>
    <div id="tabs"><button data-tab="zombies" class="on">Зомби</button><button data-tab="weapons">Оружие</button></div>
    <div id="weaponUi">
      <div id="wlist"></div>
      <div id="wanims"></div>
      <label><input type="checkbox" id="wspin" /> вращение</label>
      <label><input type="checkbox" id="wref" /> референс</label>
      <div id="wstats"></div>
    </div>
    <img id="ref" src="/refs/zombie_worker.jpg" alt="" />
    <script type="module" src="/src/debug/zombieViewer.ts"></script>
    <script type="module" src="/src/debug/weaponViewer.ts"></script>
  </body>
</html>
