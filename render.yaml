# Render Blueprint: static site built by Vite.
services:
  - type: web
    name: blockdead
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
    headers:
      # Hashed bundle names: safe to cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
